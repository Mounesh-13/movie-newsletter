# NOTE: for the auto-commit step below to work, set
# repo Settings → Actions → General → Workflow permissions to
# "Read and write permissions" (and allow GitHub Actions to create
# and approve pull requests is NOT required). Otherwise the push of
# data/sent.json will fail with a 403.

name: daily-newsletter

on:
  schedule:
    # 6 PM IST = 12:30 UTC (IST is UTC+5:30, so 18:00 - 5:30 = 12:30).
    # GitHub cron runs in UTC, hence 30 12 * * *.
    - cron: '30 12 * * *'
  workflow_dispatch: # manual trigger for end-to-end testing
    inputs:
      approve_send:
        description: 'Send the prepared draft to the real audience (review pending.json / the prepare log first)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Never run two sends concurrently (cron + manual) — avoids duplicate emails.
concurrency:
  group: daily-newsletter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare daily draft (pick + facts, no send)
        run: npm run run-all
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}

      - name: Send approved draft to audience
        if: inputs.approve_send == 'true'
        run: npm run run-all:approve
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}

      - name: Commit updated sent.json / pending.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent.json data/pending.json
          git diff --cached --quiet || git commit -m "chore: update newsletter state for $(date -u +%F)"
          git pull --rebase && git push
